version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      # 密码从同级目录 .env 文件注入（参考 .env.example），禁止明文提交
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    container_name: mysql-xiantao
    networks:
      - xiantao-net
    restart: always
  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    container_name: redis-xiantao
    networks:
      - xiantao-net
    restart: always
  backend:
    build: ./hm-dianping
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xiantao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_APPLICATION_JSON: '{"spring":{"redis":{"sentinel":{"master":"mymaster","nodes":["sentinel1:27000","sentinel2:27001","sentinel3:27002"]},"password":"${REDIS_PASSWORD}"}}}'
#    environment:
#      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/xiantao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
#      SPRING_DATASOURCE_USERNAME: root
#      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
#      SPRING_REDIS_SENTINEL_NODES: sentinel1:27000,sentinel2:27001,sentinel3:27002
#      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - xiantao-net
    restart: always
  nginx:
    image: nginx:latest
    depends_on:
      - backend
#  挂载数据
    volumes:
      - ../nginx-1.18.0/html/xiantao:/usr/share/nginx/html
      - ../nginx-1.18.0/conf/nginx.conf:/etc/nginx/nginx.conf:ro
#  暴露后端接口
    ports:
      - "80:80"
    networks:
      - xiantao-net
    container_name: nginx-xiantao
    restart: always
#    挂载数据卷
volumes:
  mysql-data:
  redis-data:
#    定义统一网络
networks:
  xiantao-net:
