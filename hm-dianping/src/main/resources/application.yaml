server:
  port: 8081
  tomcat:
    threads:
      max: 500
      min-spare: 20
    accept-count: 1000
spring:
  application:
    name: xiantao
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.161.128:3306/xiantao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 密码通过环境变量注入，请勿提交明文密码（本地运行前设置 MYSQL_PASSWORD）
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 10000
  redis:
    host: 192.168.161.128
    port: 7000
    # 密码通过环境变量注入，请勿提交明文密码（本地运行前设置 REDIS_PASSWORD）
    password: ${REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 400
        max-idle: 200
        min-idle: 20
        time-between-eviction-runs: 10000
#    sentinel:
#      master: mymaster
#      nodes:
#        - 192.168.161.128:27000
#        - 192.168.161.128:27001
#        - 192.168.161.128:27002
#      password: ${REDIS_SENTINEL_PASSWORD}
  rabbitmq:
    host: 192.168.161.128
    port: 5672
    username: xiantao
    # 密码通过环境变量注入，请勿提交明文密码（本地运行前设置 RABBITMQ_PASSWORD）
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /xiantao
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50
        concurrency: 20
        max-concurrent-consumers: 50
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.xiantao.entity
logging:
  level:
    com.xiantao: warn
    # 商品缓存预热是重要启动信息，单独放开 info 级别（其余仍保持 warn）
    com.xiantao.service.impl.GoodsServiceImpl: info
    com.xiantao.utils.OrderConsumer: info
