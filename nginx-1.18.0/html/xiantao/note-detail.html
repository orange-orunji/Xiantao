<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>闲淘</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/note-detail.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
    .header{
        position: relative;
    }
    .foot-view span{
        font-size: 12px;
    }
    .liked{

    }
  </style>
  <!-- 双模式切换：桌面版/手机版 -->
  <link href="./css/desktop.css" rel="stylesheet">
  <script src="./js/mode.js"></script>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title"></div>
    <div class="header-share">...</div>
  </div>
  <div style="height: 85%; overflow-y: scroll; overflow-x: hidden">
    <div class="note-info-box" ref="swiper"
         @touchstart="moveStart"
         @touchmove="moving"
         @touchend="moveEnd">
      <div class="swiper-item" v-for="(img, i) in note.images" :key="i">
        <img :src="img" alt="" style="width: 100%" height="100%" loading="lazy" @error="e => e.target.src='/imgs/icons/default-icon.png'">
      </div>
    </div>
    <div class="basic">
      <div class="basic-icon" @click="toOtherInfo">
        <img :src="note.icon || '/imgs/icons/default-icon.png'" alt="">
      </div>
      <div class="basic-info">
        <div class="name">{{note.name}}</div>
        <span class="time">{{formatTime(new Date(note.createTime))}}</span>
      </div>
      <div style="width: 20%">
        <div class="logout-btn" @click="follow" v-show="!user || user.id !== note.userId ">
          {{followed ? '取消关注' : '关注'}}
        </div>
        <div class="logout-btn" @click="toChat" v-show="!user || user.id !== note.userId"
             style="margin-top:4px; background:#f63; color:#fff; text-align:center;">
          私信
        </div>
      </div>

    </div>
    <div class="note-text" v-html="note.content">
    </div>
    <div class="goods-basic">
      <div class="goods-icon">
        <img :src="goods.image" alt="" loading="lazy" @error="e => e.target.src='/imgs/icons/default-icon.png'">
      </div>
      <div style="width: 80%">
        <div class="name">{{goods.name}}</div>
        <div>
          <el-rate
              v-model="goods.score/10">
          </el-rate>
        </div>
          <div class="goods-avg">￥{{goods.price}}</div>
      </div>
    </div>
    <div class="zan-box">
      <div>
        <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="20" height="20">
          <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="note.isLike ? '#ff6633' : '#82848a'"></path>
        </svg>
      </div>
      <div class="zan-list">
        <div class="user-icon-mini" v-for="u in likes" :key="u.id">
          <img :src="u.icon || '/imgs/icons/default-icon.png'" alt="" loading="lazy" @error="e => e.target.src='/imgs/icons/default-icon.png'">
        </div>
        <div style="margin-left:10px;text-align: center;line-height: 24px;">{{note.liked}}人点赞</div>
      </div>
    </div>
    <div class="note-divider"></div>
    <div class="note-comments">
      <div class="comments-head">
        <div>网友评价 <span>（{{comments.length}}）</span></div>
        <div><i class="el-icon-arrow-right"></i></div>
      </div>
      <div class="comment-list">
        <div class="comment-box" v-for="comment in comments" :key="comment.id">
          <div class="comment-icon">
            <img :src="comment.userIcon || '/imgs/icons/default-icon.png'" alt="" loading="lazy" @error="e => e.target.src='/imgs/icons/default-icon.png'">
          </div>
          <div class="comment-info">
            <div class="comment-user">{{comment.userName}}</div>
            <div style="padding: 5px 0; font-size: 14px">{{comment.content}}</div>
            <div style="color: #999; font-size: 12px">{{formatCommentTime(comment.createTime)}}</div>
          </div>
        </div>
        <div v-if="comments.length === 0" style="text-align:center; color:#999; padding:20px;">
          暂无评论，来说两句吧
        </div>
      </div>
      <div class="comment-input-box" style="display:flex; gap:8px; padding:10px; border-top:1px solid #f1f1f1;">
        <input v-model="newComment" placeholder="说点什么吧..."
               style="flex:1; border:1px solid #e1e2e3; border-radius:20px; padding:8px 15px; outline:none; font-size:14px;"
               @keyup.enter="submitComment">
        <el-button type="danger" size="small" round @click="submitComment" :disabled="!newComment.trim()">发布</el-button>
      </div>
    </div>
    <div class="note-divider"></div>
  </div>
  <div class="foot">
    <div class="foot-box">
      <div class="foot-view"  @click="addLike()">
        <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="26" height="26">
          <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="note.isLike ? '#ff6633' : '#82848a'"></path>
        </svg>
        <span :class="{liked: note.isLike}">{{note.liked}}</span>
      </div>
    </div>
    <div style="width: 40%">
    </div>
    <div class="foot-box">
      <div class="foot-view"><i class="el-icon-chat-square"></i></div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  let each = function (ary, callback) {
    for (let i = 0, l = ary.length; i < l; i++) {
      if (callback(ary[i], i) === false) break
    }
  }
  const app = new Vue({
    el: "#app",
    data: {
      util,
      note: {},
      goods: {},
      likes: [],
      user: {}, // 登录用户
      followed: false, // 是否关注了
      comments: [],
      newComment: "",
      _width: 0,
      duration: 300,
      container: null,
      items: [],
      active: 0,
      start: {
        x: 0,
        y: 0
      },
      move: {
        x: 0,
        y: 0
      },
      sensitivity: 60,
      resistance: 0.3
    },
    created() {
      let id = util.getUrlParam("id");
      this.queryGoodsNoteById(id);
    },
    methods: {
      init() {
        // 获得父容器节点
        this.container = this.$refs.swiper
        // 获得所有的子节点
        this.items = this.container.querySelectorAll('.swiper-item')
        this.updateItemWidth()
        this.setTransform()
        this.setTransition('none')
      },
      goBack() {
        history.back();
      },
      toOtherInfo(){
        if(this.note.userId === this.user.id){
          location.href = "/info.html"
        }else{
          location.href = "/other-info.html?id=" + this.note.userId
        }
      },
      toChat() {
        location.href = "/chat.html?id=" + this.note.userId
      },

      queryGoodsNoteById(id) {
        axios.get("/note/" + id)
          .then(({data}) => {
            data.images = data.images.split(",")
            this.note = data;
            this.$nextTick(this.init);
            this.queryGoodsById(data.goodsId)
            this.queryLikeList(id);
            this.queryLoginUser();
            this.queryComments(id);
          })
          .catch(this.$message.error)
      },
      queryComments(noteId) {
        axios.get("/note-comments/note/" + noteId)
          .then(({data}) => this.comments = data || [])
          .catch(() => this.comments = [])
      },
      submitComment() {
        if (!this.newComment.trim()) return;
        axios.post("/note-comments", {
            noteId: this.note.id,
            parentId: 0,
            answerId: 0,
            content: this.newComment.trim()
          })
          .then(() => {
            this.newComment = "";
            this.$message.success("评论成功");
            this.queryComments(this.note.id);
          })
          .catch(err => this.$message.error(err))
      },
      formatCommentTime(timeStr) {
        if (!timeStr) return "";
        let d = new Date(timeStr);
        let now = new Date();
        let diff = now - d;
        if (diff < 60000) return "刚刚";
        if (diff < 3600000) return Math.floor(diff / 60000) + "分钟前";
        if (diff < 86400000) return Math.floor(diff / 3600000) + "小时前";
        return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
      },
      queryGoodsById(goodsId) {
        axios.get("/goods/" + goodsId)
          .then(({data}) => {
            data.image = data.images.split(",")[0]
            this.goods = data
          })
          .catch(this.$message.error)
      },
      queryLikeList(id){
        axios.get("/note/likes/" + id)
          .then(({data}) => this.likes = data)
          .catch(this.$message.error)
      },
      addLike(){
        // 乐观更新：先改 UI，失败再回滚
        var n = this.note;
        // 笔记数据未加载成功时（无 id）直接忽略，避免发出 /note/like/undefined
        if (!n || !n.id || n._likePending) return;
        var oldLike = n.isLike;
        var oldCount = n.liked;
        n.isLike = !n.isLike;
        n.liked = n.isLike ? (n.liked || 0) + 1 : (n.liked || 0) - 1;
        n._likePending = true;
        axios.put("/note/like/" + n.id)
          .then(() => this.queryLikeList(n.id))
          .catch(err => {
            n.isLike = oldLike;
            n.liked = oldCount;
            this.$message.error(err);
          })
          .finally(() => n._likePending = false);
      },
      isFollowed(){
        axios.get("/follow/or/not/" + this.note.userId)
          .then(({data}) => this.followed = data)
          .catch(this.$message.error)
      },
      follow(){
        // 笔记数据未加载成功时无 userId，直接忽略，避免发出 /follow/undefined/...
        if (!this.note || !this.note.userId) return;
        axios.put("/follow/" + this.note.userId + "/" + !this.followed)
          .then(() => {
            this.$message.success(this.followed ? "已取消关注" : "已关注")
            this.followed = !this.followed
          })
          .catch(this.$message.error)
      },
      formatTime(b) {
        return b.getFullYear() + "年" + (b.getMonth() + 1) + "月" + b.getDate() + "日 ";
      },
      formatMinutes(m) {
        if (m < 10) m = "0" + m
        return m;
      },
      queryLoginUser(){
        // 查询用户信息
        axios.get("/user/me")
          .then(({ data }) => {
            // 保存用户
            this.user = data;
            if(this.user.id !== this.note.userId){
              this.isFollowed();
            }
          })
          .catch(console.log)
      },
      // 获取父容器宽度，并且更新所有的子节点宽度，因为我们默认所有子节点的宽高等于父节点的宽高
      updateItemWidth() {
        this._width = this.container.offsetWidth || document.documentElement.offsetWidth
      },
      // 根据当前活动子项的下标计算各个子项的X轴位置
      // 计算公式(子项的下标 - 当前活动下标) * 子项宽度 + 偏移(手指移动距离)；
      setTransform(offset) {
        offset = offset || 0
        each(this.items, (item, i) => {
          let distance = (i - this.active) * this._width + offset
          let transform = `translate3d(${distance}px, 0, 0)`
          item.style.webkitTransform = transform
          item.style.transform = transform
        })
      },
      // 给每一个子项添加transition过度动画
      setTransition(duration) {
        duration = duration || this.duration
        duration = typeof duration === 'number' ? (duration + 'ms') : duration
        each(this.items, (item) => {
          item.style.webkitTransition = duration
          item.style.transition = duration
        })
      },
      moveStart(e) {
        console.log('moveStart')
        this.start.x = e.changedTouches[0].pageX
        this.start.y = e.changedTouches[0].pageY
        this.setTransition('none')
      },
      moving(e) {
        console.log('moving')
        e.preventDefault()
        e.stopPropagation()
        let distanceX = e.changedTouches[0].pageX - this.start.x
        let distanceY = e.changedTouches[0].pageY - this.start.y
        if (Math.abs(distanceX) > Math.abs(distanceY)) {
          this.isMoving = true
          this.move.x = this.start.x + distanceX
          this.move.y = this.start.y + distanceY
          // 当活动子项为第一项且手指向右滑动或者活动项为最后一项切向左滑动的时候，添加阻力，形成一个拉弹簧的效果
          if ((this.active === 0 && distanceX > 0) || (this.active === (this.items.length - 1) && distanceX < 0)) {
            distanceX = distanceX * this.resistance
          }
          this.setTransform(distanceX)
        }
      },
      moveEnd(e) {
        console.log('moveEnd')
        if (this.isMoving) {
          e.preventDefault()
          e.stopPropagation()
          let distance = this.move.x - this.start.x
          if (Math.abs(distance) > this.sensitivity) {
            if (distance < 0) {
              this.next()
            } else {
              this.prev()
            }
          } else {
            this.back()
          }
          this.reset()
          this.isMoving = false
        }
      },
      next() {
        let index = this.active + 1
        // 运用动画切换到指定下标的子项
        this.go(index)
      },
      prev() {
        let index = this.active - 1
        // 运用动画切换到指定下标的子项
        this.go(index)
      },
      reset() {
        this.start.x = 0
        this.start.y = 0
        this.move.x = 0
        this.move.y = 0
      },
      back() {
        this.setTransition()
        this.setTransform()
      },
      destroy() {
        this.setTransition('none')
      },
      // 运用动画切换到指定下标的子项
      go(index) {
        this.active = index
        if (this.active < 0) {
          this.active = 0
        } else if (this.active > this.items.length - 1) {
          this.active = this.items.length - 1
        }
        this.$emit('change', this.active)
        this.setTransition()
        this.setTransform()
      }
    }
  })
</script>
</body>
</html>
