<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>闲淘 - 我的订单</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">
  <style>
    .order-tabs { display: flex; background: #fff; border-bottom: 1px solid #f1f1f1; }
    .order-tab { flex: 1; text-align: center; font-size: 13px; padding: 10px 0; cursor: pointer; color: #666; }
    .order-tab.active { color: #f63; font-weight: bold; border-bottom: 2px solid #f63; }
    .list-area { height: calc(100% - 84px); overflow-y: auto; background: #f1f1f1; }
    .order-card { background: #fff; margin: 8px; border-radius: 6px; padding: 10px; cursor: pointer; }
    .order-head { display: flex; justify-content: space-between; font-size: 12px; color: #999; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
    .order-status { color: #f63; font-weight: bold; }
    .order-body { display: flex; padding-top: 10px; }
    .goods-img { text-align: center; padding: 5px; width: 84px; height: 84px; background: #f2f3f5; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; }
    .goods-img img { width: 74px; height: 74px; border-radius: 5px; }
    .goods-info { flex: 1; min-width: 0; margin-left: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .goods-title { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .goods-flash { font-size: 12px; color: #f63; margin-top: 2px; }
    .order-price { color: #f63; font-weight: bold; font-size: 15px; }
    .order-time { font-size: 11px; color: #bbb; }
    .order-goods { cursor: pointer; }
    .order-actions { display: flex; justify-content: flex-end; padding-top: 8px; margin-top: 8px; border-top: 1px dashed #eee; }
    .order-actions .el-button--primary { background: #f63; border-color: #f63; }
    .pay-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .pay-dialog { width: 280px; background: #fff; border-radius: 10px; padding: 20px 16px; text-align: center; }
    .pay-title { font-size: 13px; color: #999; }
    .pay-amount { font-size: 24px; font-weight: bold; color: #f63; margin: 6px 0 14px; }
    .pay-option { height: 40px; line-height: 40px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
    .pay-option:hover { border-color: #f63; color: #f63; }
    .pay-option-cancel { border: none; color: #999; }
  </style>
  <!-- 双模式切换：桌面版/手机版 -->
  <link href="./css/desktop.css" rel="stylesheet">
  <script src="./js/mode.js"></script>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">我的订单</div>
    <div class="header-search"></div>
  </div>
  <div class="order-tabs">
    <div v-for="t in tabs" :key="t.value" class="order-tab" :class="{active: currentTab === t.value}" @click="switchTab(t.value)">{{t.label}}</div>
  </div>
  <div class="list-area">
    <div v-if="filtered.length === 0" style="text-align:center;color:#999;padding:80px 0;">
      <div style="font-size:40px;margin-bottom:10px;"><i class="el-icon-s-order"></i></div>
      暂无订单
    </div>
    <div class="order-card" v-for="o in filtered" :key="o.orderId">
      <div class="order-head">
        <span>订单号：{{o.orderId}}</span>
        <span class="order-status">{{statusText(o.status)}}</span>
      </div>
      <!-- 商品区域点击跳商品详情；订单级操作由下方按钮负责 -->
      <div class="order-body order-goods" v-if="o.goods" @click="toDetail(o.goods.id)">
        <div class="goods-img"><img :src="o.goods.images.split(',')[0]" alt="" loading="lazy" @error="e => e.target.src='/imgs/icons/default-icon.png'"></div>
        <div class="goods-info">
          <div class="goods-title">{{o.goods.name}}</div>
          <div class="goods-flash" v-if="o.flashTitle">捡漏：{{o.flashTitle}}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <div class="order-price">￥{{priceText(o)}}</div>
            <div class="order-time">{{formatTime(o.createTime)}}</div>
          </div>
        </div>
      </div>
      <div class="order-body" v-else style="color:#999;font-size:13px;">商品信息已失效</div>
      <!-- 订单操作栏：待支付→取消/支付；已支付→确认收货 -->
      <div class="order-actions" v-if="o.status === 1 || o.status === 2">
        <template v-if="o.status === 1">
          <el-button size="mini" plain @click="cancelOrder(o)">取消订单</el-button>
          <el-button size="mini" type="primary" @click="payOrder(o)">去支付</el-button>
        </template>
        <el-button v-else size="mini" type="success" plain @click="confirmOrder(o)">确认收货</el-button>
      </div>
    </div>
  </div>
  <!-- 模拟收银台：只负责支付方式选择展示，真实状态流转由后端完成 -->
  <div class="pay-mask" v-if="payingOrder" @click.self="payingOrder = null">
    <div class="pay-dialog">
      <div class="pay-title">订单金额</div>
      <div class="pay-amount">￥{{priceText(payingOrder)}}</div>
      <div class="pay-option" v-for="p in payTypes" :key="p.value" @click="doPay(p.value)">
        <i :class="p.icon"></i> {{p.label}}
      </div>
      <div class="pay-option pay-option-cancel" @click="payingOrder = null">取消</div>
    </div>
  </div>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      orders: [],
      payingOrder: null, // 正在支付的订单，非空时展示收银台
      payTypes: [
        {value: 1, label: "余额支付（模拟）", icon: "el-icon-money"},
        {value: 2, label: "支付宝（模拟）", icon: "el-icon-bank-card"},
        {value: 3, label: "微信支付（模拟）", icon: "el-icon-mobile-phone"}
      ],
      currentTab: "all",
      tabs: [
        {label: "全部", value: "all"},
        {label: "待支付", value: "1"},
        {label: "已支付", value: "2"},
        {label: "已完成", value: "3"},
        {label: "已取消", value: "cancel"}
      ]
    },
    computed: {
      filtered() {
        if (this.currentTab === "all") return this.orders;
        if (this.currentTab === "cancel") return this.orders.filter(o => o.status === 4 || o.status === 5 || o.status === 6);
        return this.orders.filter(o => o.status === parseInt(this.currentTab));
      }
    },
    created() {
      this.initTabFromUrl();
      this.queryOrders();
    },
    methods: {
      // 支持从个人主页快捷入口跳转（orders.html?tab=1），自动切换到对应 Tab
      initTabFromUrl() {
        let m = location.search.match(/[?&]tab=([^&]+)/);
        if (m) {
          let tab = m[1];
          if (tab === 'cancel' || this.tabs.some(t => t.value === tab)) {
            this.currentTab = tab;
          }
        }
      },
      queryOrders() {
        axios.get("/flash-order/mine")
          .then(({data}) => this.orders = data || [])
          .catch(() => {})
      },
      switchTab(v) {
        this.currentTab = v;
      },
      toDetail(id) {
        if (id) location.href = "/goods-detail.html?id=" + id;
      },
      priceText(o) {
        if (o.flashPrice != null) return util.formatPrice(o.flashPrice);
        return o.goods ? o.goods.price : "--";
      },
      payOrder(o) {
        this.payingOrder = o;
      },
      doPay(payType) {
        const o = this.payingOrder;
        this.payingOrder = null;
        axios.post("/flash-order/" + o.orderId + "/pay", null, {params: {payType}})
          .then(() => {
            this.$message.success("支付成功");
            this.queryOrders();
          })
          .catch(err => this.$message.error(err || "支付失败"));
      },
      cancelOrder(o) {
        this.$confirm("取消后库存将回补到捡漏池，确定取消该订单？", "取消订单", {type: "warning"})
          .then(() => {
            axios.post("/flash-order/" + o.orderId + "/cancel")
              .then(() => {
                this.$message.success("订单已取消");
                this.queryOrders();
              })
              .catch(err => this.$message.error(err || "取消失败"));
          })
          .catch(() => {});
      },
      confirmOrder(o) {
        this.$confirm("确认已收到商品？", "确认收货", {type: "warning"})
          .then(() => {
            axios.post("/flash-order/" + o.orderId + "/confirm")
              .then(() => {
                this.$message.success("已确认收货");
                this.queryOrders();
              })
              .catch(err => this.$message.error(err || "操作失败"));
          })
          .catch(() => {});
      },
      goBack() { history.back(); },
      statusText(s) {
        return {1: "待支付", 2: "已支付", 3: "已完成", 4: "已取消", 5: "退款中", 6: "已退款"}[s] || "未知";
      },
      formatTime(t) {
        if (!t) return "";
        let d = new Date(t), now = new Date(), diff = now - d;
        if (diff < 60000) return "刚刚";
        if (diff < 3600000) return Math.floor(diff / 60000) + "分钟前";
        if (diff < 86400000) return Math.floor(diff / 3600000) + "小时前";
        return (d.getMonth()+1)+"月"+d.getDate()+"日";
      }
    }
  })
</script>
</body>
</html>
